# Repérage des API Météo-France (lancé à la main uniquement). La clé reste un secret, jamais affichée.
name: Repérage API Météo-France
on:
  workflow_dispatch:
    inputs:
      script:
        default: explore_mf.py
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Repérage
        env:
          MF_VIGILANCE_KEY: ${{ secrets.MF_VIGILANCE_KEY }}
          MF_PEAROME_KEY: ${{ secrets.MF_PEAROME_KEY }}
          MF_OBS_KEY: ${{ secrets.MF_OBS_KEY }}
          MF_AROMEPI_KEY: ${{ secrets.MF_AROMEPI_KEY }}
          MF_PAQUETOBS_KEY: ${{ secrets.MF_PAQUETOBS_KEY }}
        run: python ${{ inputs.script || 'explore_mf.py' }}
