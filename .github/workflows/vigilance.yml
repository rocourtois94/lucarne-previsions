# Vigilance Météo-France : toutes les heures (la carte change à 6 h et 16 h, et à chaque évolution d'un phénomène).
# Une seule requête par passage (quota de l'API : 60 par minute). La clé reste un secret GitHub, jamais affichée.
name: Météo-France toutes les heures (vigilance, observations, AROME-PI)
on:
  schedule:
    - cron: "47 * * * *"     # à h+47 : run AROME-PI de l'heure publié, observations de l'heure arrivées
  workflow_dispatch: {}
concurrency:
  group: vigilance
  cancel-in-progress: true
jobs:
  vigilance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vigilance → R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MF_VIGILANCE_KEY: ${{ secrets.MF_VIGILANCE_KEY }}
        run: python vigilance.py
      - name: Observations des stations → R2
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MF_OBS_KEY: ${{ secrets.MF_OBS_KEY }}
          MF_PAQUETOBS_KEY: ${{ secrets.MF_PAQUETOBS_KEY }}
          MF_VIGILANCE_KEY: ${{ secrets.MF_VIGILANCE_KEY }}
        run: python obs.py
      - name: AROME prévision immédiate → R2
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MF_AROMEPI_KEY: ${{ secrets.MF_AROMEPI_KEY }}
        run: python aromepi.py
