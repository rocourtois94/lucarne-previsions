# MeteoSwiss ICON-CH2 (nuages + 21 scénarios) : vérifié toutes les heures, calculé seulement quand un nouveau run
# (00, 06, 12, 18 UTC, complet ≈ 4 h après) est publié. Les autres modèles restent dans « Prévisions Lucarne ».
name: MeteoSwiss toutes les heures
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main
concurrency:
  group: previsions
  cancel-in-progress: false
jobs:
  nuages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcul et dépôt dans R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MF_VIGILANCE_KEY: ${{ secrets.MF_VIGILANCE_KEY }}     # facultatif : vigilance Météo-France
          JOBS: nuages
        run: python lucarne_forecast.py
