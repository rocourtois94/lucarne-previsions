# Prévisions Lucarne : nébulosité MeteoSwiss ICON-CH2 → morceaux dans R2 (carte.photily.fr/fc1/)
# Les runs ICON-CH2 (00, 06, 12, 18 UTC) sont complets environ 4 h après ; on passe 4 h 20 après chaque run.
name: Prévisions Lucarne
on:
  schedule:
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main
concurrency:
  group: previsions
  cancel-in-progress: false
jobs:
  nuages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcul et dépôt dans R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python lucarne_forecast.py
